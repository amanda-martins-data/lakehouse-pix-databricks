# Databricks Asset Bundle: o job e os notebooks como código, versionados no Git.
# Validar:  databricks bundle validate -t free
# Publicar: databricks bundle deploy -t free
# Rodar:    databricks bundle run pix_lakehouse -t free
bundle:
  name: lakehouse-pix

include:
  - resources/*.yml

variables:
  catalogo:
    description: Catálogo do Unity Catalog onde ficam os schemas pix_bronze, pix_silver e pix_gold
    default: workspace
  pular_extracao:
    description: '"sim" quando os arquivos são enviados ao volume pelo script local'
    default: nao

targets:
  # Etapa 1: Databricks Free Edition (gratuita, só computação serverless).
  free:
    mode: development
    default: true
    workspace:
      host: https://dbc-41afa8a3-e2ae.cloud.databricks.com   # para rodar no seu, troque pelo endereço do seu workspace
    variables:
      # A Free Edition não alcança olinda.bcb.gov.br (URLError, testado em 26/11/2026).
      # Os arquivos chegam ao volume por fora (scripts/baixar_pix.py) e o Job começa na Bronze.
      pular_extracao: sim

  # Etapa 2: Azure Databricks, provisionado com Terraform (ver infra/azure, a criar).
  azure:
    mode: production
    workspace:
      host: https://adb-XXXXXXXXXXXXXXX.X.azuredatabricks.net
    variables:
      catalogo: pix_lakehouse
